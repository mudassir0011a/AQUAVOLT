<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaVolt: Civic Issue Reporter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/google-genai-v0.11.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@19.2.0/client",
    "react": "https://aistudiocdn.com/react@19.2.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@6.22.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@19.2.0/",
    "react/": "https://aistudiocdn.com/react@19.2.0/"
  }
}
</script>
<style>
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.3s ease-out forwards;
      }

      /* ADDED FOR LOADING & TRANSITIONS */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .spinner {
        animation: spin 0.8s linear infinite;
        border: 4px solid transparent;
        border-radius: 50%;
        width: 48px;
        height: 48px;
      }
      :root { --spinner-color: #10b981; }
      .dark { --spinner-color: #34d399; }
      .spinner { border-top-color: var(--spinner-color); }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      .animate-fade-in { animation: fade-in 0.2s ease-out forwards; }
      .animate-fade-out { animation: fade-out 0.3s ease-in forwards; }
      
      /* ADDED FOR ADMIN MAP */
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.3);
        }
      }
      .animate-pulse-marker {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
